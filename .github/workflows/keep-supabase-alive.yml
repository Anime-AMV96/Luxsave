name: Keep Supabase Alive

# ⏰ Esegue automaticamente ogni 5 giorni alle 3 AM UTC
on:
  schedule:
    - cron: '0 3 */5 * *'
  workflow_dispatch: # Permette di eseguirlo manualmente da GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Ping Supabase Database
        run: |
          echo "🚀 Pinging LUXSAVE Supabase..."
          
          # Query semplice: conta gli utenti (non modifica nulla)
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/users?select=count" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -w "\n📊 Response code: %{http_code}\n" \
            --fail-with-body
          
          echo "✅ Ping completato con successo!"
      
      - name: 📢 Notifica su Discord
        if: success()
        continue-on-error: true
        run: |
          echo "📨 Tentativo invio notifica Discord..."
          
          # Prova a inviare la notifica (ma non fallisce se Discord è irraggiungibile)
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -m 10 \
            -d '{
              "embeds": [{
                "title": "✅ LUXSAVE - Supabase Attivo",
                "description": "Il ping automatico ha mantenuto il database attivo con successo!",
                "color": 65535,
                "fields": [
                  {
                    "name": "📅 Data",
                    "value": "'"$(date -u '+%d/%m/%Y %H:%M:%S UTC')"'",
                    "inline": true
                  },
                  {
                    "name": "⏱️ Prossimo ping",
                    "value": "Tra 5 giorni",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "LUXSAVE Auto-Ping System"
                },
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
          && echo "✅ Notifica Discord inviata!" \
          || echo "⚠️ Discord non raggiungibile (normale, non è un errore)"
